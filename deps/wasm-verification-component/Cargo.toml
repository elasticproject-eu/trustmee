[package]
name = "wasm-verification-component"
version = "0.1.0"
edition = "2021"
description = "Minimal evidence-only attestation verifier host for Trustee verifier components"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
wasmtime = { version = "25.0.3", features = ["component-model"] }
wasmtime-wasi = { version = "25.0.3" }
wasmtime-wasi-http = { version = "25.0.3" }
